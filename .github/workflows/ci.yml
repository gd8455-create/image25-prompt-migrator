name: Validate public skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate package
        run: python -X utf8 scripts/validate_repo.py
      - name: Run behavior tests
        run: python -X utf8 -m unittest discover -s tests -v
